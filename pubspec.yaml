name: scoliocare_app
description: "ScolioCare - AI-powered scoliosis monitoring and exercise tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sensors_plus: ^4.0.2
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  share_plus: ^7.2.2
  open_filex: ^4.4.0
  path_provider: ^2.1.2
  fl_chart: ^0.66.2
  intl: ^0.18.1
  google_sign_in: ^6.2.1
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  font_awesome_flutter: 10.7.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - Gemini_Generated_Image_3a5h2r3a5h2r3a5h.png
